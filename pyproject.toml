[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "washington-csed504-cv-search"
version = "0.3.0"
description = "Hardware-aware, multi-stage PyTorch hyperparameter optimization for CSED 504 computer-vision experiments"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "WashingtonCsed504 contributors"}]
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "optuna>=4.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebook = ["jupyter>=1", "nbformat>=5.10", "pandas>=2.1"]
imagenet32 = ["pyarrow>=15", "rich>=13", "tqdm>=4.66"]
huggingface = ["datasets>=2.19", "huggingface-hub>=0.23"]

[project.scripts]
cv-search = "cv_search.cli.search:main"
cv-benchmark = "cv_search.cli.benchmark:main"
cv-report = "cv_search.cli.report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cv_search*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
