[study]
name = "parallel-cpu-smoke"
output_dir = "results"
mode = "continuous"

[model]
adapter = "cnn"
profile = "custom"

[dataset]
name = "fake"
train_examples = 32
validation_examples = 12
test_examples = 8
image_size = 32
num_classes = 10
split_seed = 17

[search]
sampler = "explicit"
trials = 4
seed = 11

[execution]
device = "cpu"
precision = "fp32"
parallel_mode = "parallel_trials"
trial_concurrency = 2
num_workers = 0
num_workers_total = 0
intraop_threads = 1
interop_threads = 1
batch_size_scope = "global"
compile = false

[objectives.validation_accuracy]
direction = "maximize"

[parameters.batch_size]
enabled = false
type = "fixed"
fixed = 8

[parameters.warmup_epochs]
enabled = false
type = "fixed"
fixed = 0

[[explicit.configurations]]
width_multiplier = 0.125
stage_blocks = "1,1,1,1"
optimizer = "sgd"
learning_rate = 0.01
weight_decay = 0.0
momentum = 0.9
nesterov = false
batch_size = 8
scheduler = "none"
warmup_epochs = 0

[[explicit.configurations]]
width_multiplier = 0.125
stage_blocks = "1,1,1,1"
optimizer = "sgd"
learning_rate = 0.02
weight_decay = 0.0
momentum = 0.9
nesterov = false
batch_size = 8
scheduler = "none"
warmup_epochs = 0

[[explicit.configurations]]
width_multiplier = 0.125
stage_blocks = "1,1,1,1"
optimizer = "sgd"
learning_rate = 0.03
weight_decay = 0.0
momentum = 0.9
nesterov = false
batch_size = 8
scheduler = "none"
warmup_epochs = 0

[[explicit.configurations]]
width_multiplier = 0.125
stage_blocks = "1,1,1,1"
optimizer = "sgd"
learning_rate = 0.04
weight_decay = 0.0
momentum = 0.9
nesterov = false
batch_size = 8
scheduler = "none"
warmup_epochs = 0

[stages.proxy]
enabled = true
trials = 4
resource = "steps"
max_train_steps = 1
max_validation_batches = 1
data_fraction = 1.0
top_k = 2

[stages.halving]
enabled = false

[stages.full]
enabled = false
